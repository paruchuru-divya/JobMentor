steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/jobmentor-ai:$COMMIT_SHA', '.']

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/jobmentor-ai:$COMMIT_SHA']

  # 3. Deploy container image to Cloud Run with mandatory challenge label
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'jobmentor-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/jobmentor-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--labels=dev-tutorial=cloud-run-ai-challenge'

images:
  - 'gcr.io/$PROJECT_ID/jobmentor-ai:$COMMIT_SHA'
